services:
  postgres:
    image: postgres:16-alpine
    container_name: tours-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tours
      POSTGRES_PASSWORD: tours
      POSTGRES_DB: tours
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tours -d tours"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: tours-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tours:tours@postgres:5432/tours?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
